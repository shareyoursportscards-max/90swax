<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frank Thomas Card Prices — Coming Soon — 90sWax</title>
<meta name="description" content="The 90sWax Frank Thomas PSA 8, 9 and 10 price guide is coming soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f12;--surface:#14191f;--border:rgba(255,255,255,.08);--teal:#2fe6c7;--text:#e5e7eb;--dim:#9ca3af}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter Tight',system-ui,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{max-width:520px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 24px}
.box img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:52% 15%;border:2px solid var(--teal)}
h1{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;font-size:40px;line-height:1.05;margin:18px 0 6px}
.tag{display:inline-block;color:var(--teal);font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
p{color:var(--dim);line-height:1.55;margin:0 0 22px}
a.btn{display:inline-block;padding:11px 18px;border-radius:10px;border:1px solid var(--teal);color:var(--teal);text-decoration:none;font-weight:600}
a.btn:hover{background:rgba(47,230,199,.08)}
</style>
</head>
<body>
<main>
  <div class="box">
    <img src="/img/players/thomas.png" alt="Frank Thomas">
    <h1>Frank Thomas</h1>
    <span class="tag">Coming soon</span>
    <p>The PSA 8, 9 and 10 price guide for Frank Thomas is on the way.</p>
    <a class="btn" href="/">Back to 90sWax</a>
  </div>
</main>
</body>
</html>
